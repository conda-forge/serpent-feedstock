schema_version: 1

context:
  version: 1.43

package:
  name: serpent
  version: {{ version }}

source:
  fn: serpent-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/s/serpent/serpent-{{ version }}.tar.gz
  sha256: 62dc242fd4ea2a50339f4f5aaaf6ecc55605ee74770d7eb2031e760d90a0d114

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - serpent

about:
  home: https://github.com/irmen/Serpent
  license: MIT
  license_file: LICENSE
  summary: Serialization based on ast.literal_eval

extra:
  recipe-maintainers:
    - irmen
    - whart222
